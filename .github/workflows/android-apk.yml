name: Android APK
on:
  push:
    branches: [main, feat/android-listener]
    paths: ['android/**', 'dxtalker/privileges.py', 'scripts/sync_privileges.py', '.github/workflows/android-apk.yml']
  pull_request:
    paths: ['android/**', 'dxtalker/privileges.py', 'scripts/sync_privileges.py', '.github/workflows/android-apk.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: cd android && gradle testDebugUnitTest assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: DXTalker-Android-debug
          path: android/app/build/outputs/apk/debug/*.apk

  navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: cd android && bash verify-navigation.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-navigation-verification
          path: |
            android/app/build/reports/androidTests/
            android/screenshots/
