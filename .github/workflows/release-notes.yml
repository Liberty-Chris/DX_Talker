name: Release notes

on:
  push:
    branches: [main]
    paths:
      - 'docs/releases/v*.md'
      - 'scripts/sync_release_notes.py'
      - '.github/workflows/release-notes.yml'
  pull_request:
    paths:
      - 'docs/releases/v*.md'
      - 'scripts/sync_release_notes.py'
      - 'tests/test_release_notes.py'
      - '.github/workflows/release-notes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python scripts/sync_release_notes.py --check
      - run: python -m unittest discover -s tests -p test_release_notes.py -v
  sync:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    concurrency:
      group: dxtalker-release-notes
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Correct published release text only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/sync_release_notes.py
