name: Windows pilot

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_docs.py
      - run: python scripts/check_versions.py

  windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - name: Check source UI and Windows speech without RF
        run: |
          python run_dxtalker.py --self-test source-smoke.json
          if ($LASTEXITCODE -ne 0) { Get-Content source-smoke.json; throw 'Source smoke test failed' }
      - name: Build portable Windows application
        run: ./scripts/build_windows.ps1
      - name: Check packaged UI and Windows speech without RF
        run: |
          $process = Start-Process -FilePath ./dist/DXTalker/DXTalker.exe -ArgumentList '--self-test', "$PWD/package-smoke.json" -PassThru
          if (-not $process.WaitForExit(90000)) { $process.Kill(); throw 'Package smoke test timed out' }
          if ($process.ExitCode -ne 0) { Get-Content package-smoke.json; throw 'Package smoke test failed' }
          $report = Get-Content package-smoke.json -Raw | ConvertFrom-Json
          if (-not $report.ok) { throw 'Package report failed' }
      - name: Build Windows installer
        run: ./scripts/build_installer.ps1
      - name: Verify install, shortcuts, installed launch, reinstall and removal
        run: ./scripts/check_installer.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-verification
          path: |
            *-smoke.json
            *-smoke*.png
      - uses: actions/upload-artifact@v4
        with:
          name: DXTalker-Windows-x64
          path: dist/DXTalker/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: DXTalker-Setup-Windows-x64
          path: dist/DXTalker-Setup-Windows-x64.exe
          if-no-files-found: error


  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tests, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: DXTalker-Setup-Windows-x64
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: DXTalker-Windows-x64
          path: portable/DXTalker
      - name: Verify tag and prepare release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/check_versions.py "$RELEASE_TAG"
          cd portable
          zip -qr ../release/DXTalker-Windows-x64.zip DXTalker
          cd ../release
          sha256sum DXTalker-Setup-Windows-x64.exe DXTalker-Windows-x64.zip > SHA256SUMS.txt
      - name: Publish tested release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          extra=()
          if [[ "$RELEASE_TAG" =~ (a|b|rc)[0-9]+$ ]]; then extra+=(--prerelease); fi
          gh release create "$RELEASE_TAG" release/* --verify-tag --title "DX Talker $RELEASE_TAG" --notes-file docs/releases/current.md "${extra[@]}"
