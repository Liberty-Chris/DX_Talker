name: Windows pilot

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish the current main version after verification'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Check publication version before packaging
        if: runner.os == 'Linux' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main'))
        shell: bash
        run: |
          release_tag="v$(python -c 'from dxtalker import __version__; print(__version__)')"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then release_tag="$GITHUB_REF_NAME"; fi
          python scripts/check_versions.py "$release_tag"
          existing="$(git ls-remote origin "refs/tags/$release_tag" | cut -f1)"
          python scripts/check_published_release.py --check-target "$release_tag" "$GITHUB_SHA" "$existing"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_docs.py
      - run: python scripts/check_versions.py
      - run: python scripts/sync_privileges.py --check
      - name: Verify private PHP speech gateway
        if: runner.os == 'Linux'
        run: php server/speech/test_gateway.php

  windows:
    needs: tests
    strategy:
      matrix:
        architecture: [x64, x86]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture }}
      - run: python -m pip install -r requirements-build.txt
      - name: Configure shared pilot speech endpoint
        env:
          DXTALKER_SPEECH_CONFIG: ${{ secrets.DXTALKER_SPEECH_CONFIG }}
        run: python scripts/configure_speech_build.py
      - name: Check source UI and Windows speech without RF
        run: |
          python run_dxtalker.py --self-test source-smoke.json
          if ($LASTEXITCODE -ne 0) { Get-Content source-smoke.json; throw 'Source smoke test failed' }
      - name: Build portable Windows application
        run: ./scripts/build_windows.ps1 -Architecture ${{ matrix.architecture }}
      - name: Check packaged UI and Windows speech without RF
        run: |
          $process = Start-Process -FilePath ./dist/DXTalker/DXTalker.exe -ArgumentList '--self-test', "$PWD/package-smoke.json" -PassThru
          if (-not $process.WaitForExit(90000)) { $process.Kill(); throw 'Package smoke test timed out' }
          if ($process.ExitCode -ne 0) { Get-Content package-smoke.json; throw 'Package smoke test failed' }
          $report = Get-Content package-smoke.json -Raw | ConvertFrom-Json
          if (-not $report.ok) { throw 'Package report failed' }
      - name: Build Windows installer
        run: ./scripts/build_installer.ps1 -Architecture ${{ matrix.architecture }}
      - name: Verify install, shortcuts, installed launch, reinstall and removal
        run: ./scripts/check_installer.ps1 -Architecture ${{ matrix.architecture }}
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: Windows-verification-${{ matrix.architecture }}
          path: |
            *-smoke.json
            *-smoke*.png
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: DXTalker-Windows-${{ matrix.architecture }}
          path: dist/DXTalker/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: DXTalker-Setup-Windows-${{ matrix.architecture }}
          path: dist/DXTalker-Setup-Windows-${{ matrix.architecture }}.exe
          if-no-files-found: error


  neural_speech:
    env:
      ORT_DISABLE_TELEMETRY: '1'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install piper-tts==1.8.0
      - uses: actions/cache@v6.1.0
        with:
          path: .piper-test-voices
          key: piper-english-packs-v2
      - run: python -m piper.download_voices --download-dir .piper-test-voices en_US-lessac-medium
      - name: Render a real neural voice without opening audio or PTT
        run: |
          $piper = (Get-Command piper.exe).Source
          python scripts/check_piper.py --executable "$piper" --model "$PWD/.piper-test-voices/en_US-lessac-medium.onnx" --report piper-smoke.json
      - name: Generate a reusable English voice pack
        run: |
          python -m piper.download_voices --download-dir .piper-test-voices en_US-ljspeech-high
          Invoke-WebRequest 'https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/ljspeech/high/MODEL_CARD' -OutFile .piper-test-voices/en_US-ljspeech-high.MODEL_CARD
          python scripts/build_voicepacks.py --model .piper-test-voices/en_US-ljspeech-high.onnx --output voicepacks/en_US-ljspeech-high --license .piper-test-voices/en_US-ljspeech-high.MODEL_CARD --label 'LJ Speech English female'
          python scripts/check_voicepack.py voicepacks/en_US-ljspeech-high
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: DXTalker-VoicePack-LJ-high
          path: voicepacks/
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: Piper-verification
          path: piper-smoke.json

  xp_application:
    uses: ./.github/workflows/windows-xp.yml
    secrets:
      DXTALKER_SPEECH_CONFIG: ${{ secrets.DXTALKER_SPEECH_CONFIG }}

  xp_source_kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python legacy/xp/listen.py --self-test
      - run: python -c "import ast,pathlib; ast.parse(pathlib.Path('legacy/xp/listen.py').read_text(), feature_version=(3,4))"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: DXTalker-XP-source-test-kit
          path: legacy/xp/

  android_release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main')
    uses: ./.github/workflows/android-apk.yml

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main')
    needs: [tests, windows, neural_speech, xp_application, android_release]
    concurrency:
      group: dxtalker-release-publication
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: DXTalker-Setup-Windows-x64
          path: release
      - uses: actions/download-artifact@v8.0.2
        with:
          name: DXTalker-Windows-x64
          path: portable/DXTalker
      - uses: actions/download-artifact@v8.0.2
        with:
          name: DXTalker-Setup-Windows-x86
          path: release
      - uses: actions/download-artifact@v8.0.2
        with:
          name: DXTalker-Windows-x86
          path: portable-x86/DXTalker
      - uses: actions/download-artifact@v8.0.2
        with:
          name: Windows-XP-installer-x86
          path: release
      - uses: actions/download-artifact@v8.0.2
        with:
          name: Windows-XP-installer-x64
          path: release
      - uses: actions/download-artifact@v8.0.2
        with:
          name: DXTalker-Android-debug
          path: android-apk
      - name: Prepare the verified Android APK
        run: |
          test -s android-apk/app-debug.apk
          mkdir -p release
          cp android-apk/app-debug.apk release/DXTalker-Android.apk
      - uses: actions/download-artifact@v8.0.2
        with:
          name: DXTalker-VoicePack-LJ-high
          path: voicepacks
      - run: cd voicepacks && zip -qr ../release/DXTalker-VoicePack-LJ-high.zip .
      - name: Verify tag and prepare release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            RELEASE_TAG="v$(python -c 'from dxtalker import __version__; print(__version__)')"
          fi
          python scripts/check_versions.py "$RELEASE_TAG"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          cd portable
          zip -qr ../release/DXTalker-Windows-x64.zip DXTalker
          cd ../portable-x86
          zip -qr ../release/DXTalker-Windows-x86.zip DXTalker
          cd ../release
          sha256sum *.exe *.zip *.apk > SHA256SUMS.txt
      - name: Publish tested release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/release_assets.py release > release-arguments.txt
          mapfile -t assets < release-arguments.txt
          python scripts/release_assets.py release --notes docs/releases/current.md --tag "$RELEASE_TAG" --output prepared-release-notes.md
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            existing="$(git ls-remote origin "refs/tags/$RELEASE_TAG" | cut -f1)"
            python scripts/check_published_release.py --check-target "$RELEASE_TAG" "$GITHUB_SHA" "$existing"
            if [[ -z "$existing" ]]; then
              git tag "$RELEASE_TAG" "$GITHUB_SHA"
              git push origin "refs/tags/$RELEASE_TAG"
            fi
          fi
          if python scripts/check_published_release.py "$RELEASE_TAG" release; then
            exit 0
          else
            result=$?
            if [[ "$result" != 3 ]]; then exit "$result"; fi
          fi
          extra=()
          if [[ "$RELEASE_TAG" =~ (a|b|rc)[0-9]+$ ]]; then extra+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --title "DX Talker $RELEASE_TAG" --notes-file prepared-release-notes.md "${extra[@]}"
