name: Windows XP application checks
on:
  push:
    branches: [feat/xp-core-installers]
    paths: ['platforms/xp/**', 'dxtalker/**', 'tests/**', '.github/workflows/windows-xp.yml']
  pull_request:
    paths: ['platforms/xp/**', 'dxtalker/**', 'tests/**', '.github/workflows/windows-xp.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  xp:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        architecture: [x86, x64]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Stage official private XP runtime and shared application
        run: python platforms/xp/prepare.py --architecture ${{ matrix.architecture }} --out build/xp-${{ matrix.architecture }}
      - name: Run shared behavioral checks with the bundled Python 3.4
        run: |
          $app = "$PWD/build/xp-${{ matrix.architecture }}"
          & "$app/runtime/python.exe" -I -c "import sys;sys.path.insert(0,r'$app');from xp_support.test_runner import run;raise SystemExit(0 if run(r'$app') else 1)"
          if ($LASTEXITCODE -ne 0) { throw 'XP shared behavior checks failed' }
      - name: Check complete UI, QR, private secrets and SAPI without playback or PTT
        run: |
          $app = "$PWD/build/xp-${{ matrix.architecture }}"
          $process = Start-Process "$app/runtime/python.exe" -ArgumentList '-I', "`"$app/run_xp.py`"", '--self-test', "`"$PWD/xp-${{ matrix.architecture }}-smoke.json`"" -PassThru
          if (-not $process.WaitForExit(90000)) { $process.Kill(); throw 'XP UI check timed out' }
          if ($process.ExitCode -ne 0) { Get-Content xp-${{ matrix.architecture }}-smoke.json; throw 'XP UI check failed' }
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: XP-verification-${{ matrix.architecture }}
          path: |
            xp-*-smoke.json
            build/*-msi-image.log
